<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生活打卡 Web 原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="应用导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">记</div>
          <div>
            <h1>生活打卡</h1>
            <p>通用 Web 原型</p>
          </div>
        </div>

        <nav class="tabs" aria-label="主页面">
          <button class="tab-button is-active" type="button" data-view="today">
            <span class="tab-icon" aria-hidden="true">⌖</span>
            今日打卡
          </button>
          <button class="tab-button" type="button" data-view="history">
            <span class="tab-icon" aria-hidden="true">◷</span>
            历史记录
          </button>
        </nav>

        <div class="sidebar-note">
          <strong>通用地点</strong>
          <span>定位或手动输入地点后保存记录。</span>
        </div>
      </aside>

      <main class="main-content">
        <section class="view is-active" id="today-view" aria-labelledby="today-title">
          <div class="view-header">
            <div>
              <h2 id="today-title">今日打卡</h2>
              <p>人的记忆总是有限的，美好的生活需要你去记录~</p>
            </div>
            <button class="ghost-button" id="refresh-time" type="button">刷新时间</button>
          </div>

          <form class="checkin-form" id="checkin-form">
            <section class="panel">
              <div class="panel-title">
                <span>地点信息</span>
                <span class="status-pill">定位 / 手动</span>
              </div>
              <div class="place-editor">
                <label class="place-name-field">
                  <span>打卡点</span>
                  <input
                    id="checkin-point-input"
                    type="text"
                    placeholder="输入地点名称，例如餐厅、学校、公园"
                    autocomplete="organization"
                    required
                  />
                </label>
                <label>
                  <span>具体地址</span>
                  <input
                    id="place-input"
                    type="text"
                    placeholder="手动输入地址，或使用当前位置自动填入"
                    autocomplete="street-address"
                  />
                </label>
                <div class="place-actions">
                  <button class="ghost-button location-button" id="use-location" type="button">
                    <span aria-hidden="true">⌖</span>
                    使用当前位置
                  </button>
                  <span class="location-status" id="location-status">手动输入</span>
                </div>
              </div>
              <a class="map-attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">
                地址数据 © OpenStreetMap
              </a>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span>打卡时间</span>
              </div>
              <div class="time-row">
                <time id="current-time" datetime=""></time>
                <span>保存时将写入这次打卡记录</span>
              </div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span>体验评分</span>
                <span class="score-average" id="live-average">平均 8.0</span>
              </div>
              <div class="score-tag-editor">
                <input id="custom-score-input" type="text" placeholder="输入自定义标签，例如卫生、排队时间" />
                <button class="ghost-button" id="add-score-tag" type="button">添加标签</button>
              </div>
              <div class="score-list" id="score-list"></div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span>本地图片</span>
                <span class="muted">最多 3 张</span>
              </div>
              <label class="upload-zone" for="image-input">
                <span class="upload-icon" aria-hidden="true">＋</span>
                <span>选择本地图片</span>
                <small>图片只保存在浏览器本地存储中</small>
              </label>
              <input id="image-input" type="file" accept="image/*" multiple hidden />
              <div class="image-preview-grid" id="image-preview-grid" aria-live="polite"></div>
            </section>

            <section class="panel">
              <div class="panel-title">
                <span>备注</span>
                <span class="muted">可选</span>
              </div>
              <textarea id="note-input" rows="4" placeholder="记录今天的感受，例如课程体验、食堂印象、校园环境。"></textarea>
            </section>

            <div class="form-actions">
              <button class="primary-button" type="submit">保存打卡</button>
              <button class="ghost-button" id="generate-poster" type="button">生成图片</button>
              <button class="ghost-button" id="reset-form" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="view" id="history-view" aria-labelledby="history-title">
          <div class="view-header">
            <div>
              <h2 id="history-title">历史记录</h2>
              <p>按时间倒序查看已保存的本地打卡。</p>
            </div>
            <button class="ghost-button danger" id="clear-records" type="button">清空记录</button>
          </div>

          <div class="history-layout">
            <section class="history-list" id="history-list" aria-live="polite"></section>
            <aside class="detail-panel" id="detail-panel" aria-live="polite">
              <div class="empty-detail">
                <span aria-hidden="true">⌖</span>
                <p>选择一条记录查看详情</p>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="poster-modal" id="poster-modal" aria-hidden="true">
      <div class="poster-backdrop" data-close-poster></div>
      <section class="poster-dialog" role="dialog" aria-modal="true" aria-labelledby="poster-title">
        <div class="poster-header">
          <div>
            <h2 id="poster-title">打卡长图</h2>
            <p>可下载到手机后保存到相册</p>
          </div>
          <button class="poster-close" id="poster-close" type="button" aria-label="关闭长图预览">×</button>
        </div>
        <div class="poster-preview-frame">
          <img id="poster-preview" alt="打卡长图预览" />
        </div>
        <div class="poster-actions">
          <a class="primary-button" id="poster-download" href="#" download="生活打卡长图.png">下载图片</a>
          <button class="ghost-button" type="button" data-close-poster>关闭预览</button>
        </div>
      </section>
    </div>

    <template id="empty-history-template">
      <div class="empty-state">
        <span aria-hidden="true">◷</span>
        <h3>暂无打卡记录</h3>
        <p>保存今日打卡后，记录会显示在这里。</p>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
